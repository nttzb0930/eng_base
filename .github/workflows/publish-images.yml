name: Publish Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag to publish. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image-prefix: ${{ steps.metadata.outputs.image_prefix }}
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      api-image: ${{ steps.metadata.outputs.api_image }}
      web-image: ${{ steps.metadata.outputs.web_image }}
      admin-image: ${{ steps.metadata.outputs.admin_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image metadata
        id: metadata
        env:
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu

          image_prefix="${REGISTRY}/${GITHUB_REPOSITORY}"
          image_prefix="$(printf '%s' "$image_prefix" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$DISPATCH_IMAGE_TAG" ]; then
            image_tag="$DISPATCH_IMAGE_TAG"
          elif [ -n "$WORKFLOW_RUN_SHA" ]; then
            image_tag="$WORKFLOW_RUN_SHA"
          else
            image_tag="$GITHUB_SHA"
          fi

          echo "image_prefix=$image_prefix" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "api_image=$image_prefix-api" >> "$GITHUB_OUTPUT"
          echo "web_image=$image_prefix-web" >> "$GITHUB_OUTPUT"
          echo "admin_image=$image_prefix-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.api_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.api_image }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.web_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.web_image }}:main
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'English Base' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_WEB_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.admin_image }}:${{ steps.metadata.outputs.image_tag }}
            ${{ steps.metadata.outputs.admin_image }}:main
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'English Base' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api' }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
