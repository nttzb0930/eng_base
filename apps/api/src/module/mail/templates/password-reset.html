<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu</title>
  </head>
  <body style="margin:0;background:#f1f5f9;color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f1f5f9;padding:32px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
          <tr><td style="height:5px;background:#059669;font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr><td style="padding:28px 28px 10px;text-align:center;">
            <div style="display:inline-block;padding:10px 14px;border-radius:10px;background:#ecfdf5;color:#047857;font-size:18px;font-weight:700;">{{appName}}</div>
            <h1 style="margin:22px 0 8px;font-size:24px;line-height:1.3;color:#0f172a;">Đặt lại mật khẩu</h1>
            <p style="margin:0;color:#64748b;font-size:15px;line-height:1.6;">Nhập mã dưới đây để tạo mật khẩu mới.</p>
          </td></tr>
          <tr><td style="padding:24px 28px 8px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f0fdf4;border:1px dashed #34d399;border-radius:12px;"><tr><td align="center" style="padding:22px 16px;"><span style="font-family:Courier New,monospace;font-size:36px;line-height:1;font-weight:700;letter-spacing:9px;color:#047857;">{{code}}</span></td></tr></table>
          </td></tr>
          <tr><td style="padding:12px 28px 0;text-align:center;"><p style="margin:0;color:#b45309;font-size:14px;font-weight:600;">Mã có hiệu lực trong {{expiresInMinutes}} phút.</p></td></tr>
          <tr><td style="padding:24px 28px 30px;text-align:center;"><p style="margin:0;color:#64748b;font-size:13px;line-height:1.6;">Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này và kiểm tra bảo mật tài khoản.</p></td></tr>
          <tr><td style="border-top:1px solid #e2e8f0;padding:18px 28px;text-align:center;"><p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.5;">Email tự động từ {{appName}}. Vui lòng không trả lời email này.</p></td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
